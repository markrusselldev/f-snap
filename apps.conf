# format: snap_name:method:config_path:target
#   snap_name   - the Snap package to replace
#   method      - apt or flatpak
#   config_path - the app's profile/config folder, relative to $HOME; several separated by |
#                 when the app uses whichever exists; - if it has none
#   target      - apt: the APT package(s) to install, space-separated; flatpak: the Flathub app ID
#
# A catalog: f-snap replaces only the Snaps listed here that are installed, and only where the
# replacement is better for the user (evidence: docs/research/apps.md). Ubuntu's own
# system tools (App Center, Firmware Updater, Security Center, prompting-client, hwctl, ...)
# are deliberately absent: Ubuntu ships them as snaps, and f-snap leaves them alone.
firefox:apt:.mozilla|.config/mozilla:firefox
thunderbird:apt:.thunderbird|.config/thunderbird:thunderbird
element-desktop:apt:.config/Element:element-desktop
# Flathub's Krita keeps its data under ~/.var/app/org.kde.krita, so no profile is copied. The
# snap's settings survive only in the snapshot `snap remove` keeps (see `snap saved`).
krita:flatpak:-:org.kde.krita
